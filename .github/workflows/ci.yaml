name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed lib example test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
